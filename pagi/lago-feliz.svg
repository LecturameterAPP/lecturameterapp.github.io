<svg xmlns="http://www.w3.org/2000/svg" viewBox="-90 -90 380 390" overflow="visible">
  <style>
    @keyframes lago-hop { 0%{transform:translateY(0) rotate(0deg)} 18%{transform:translateY(0) scaleY(0.94)} 42%{transform:translateY(-7%) rotate(-2deg)} 62%{transform:translateY(-4%) rotate(2deg)} 82%{transform:translateY(0) scaleY(0.97)} 100%{transform:translateY(0)} }
    @keyframes lago-blink { 0%,92%,100%{transform:scaleY(1)} 96%{transform:scaleY(0.08)} }
    @keyframes lago-cheer-l { 0%,100%{transform:translate(-4%,6%) rotate(-8deg)} 50%{transform:translate(2%,-26%) rotate(16deg)} }
    @keyframes lago-cheer-r { 0%,100%{transform:translate(4%,6%) rotate(8deg)} 50%{transform:translate(-2%,-26%) rotate(-16deg)} }
    @keyframes lago-spark { 0%,100%{transform:scale(0.5);opacity:0.35} 50%{transform:scale(1);opacity:1} }
    @keyframes lago-star { 0%,100%{transform:scale(0.45) rotate(-18deg);opacity:0.4} 50%{transform:scale(1) rotate(12deg);opacity:1} }
    .l-body { transform-box:fill-box; transform-origin:100px 120px; animation:lago-hop 1.15s cubic-bezier(.3,.7,.4,1) infinite; }
    .l-arm-l { transform-box:fill-box; transform-origin:80% 50%; animation:lago-cheer-l 0.575s ease-in-out infinite; }
    .l-arm-r { transform-box:fill-box; transform-origin:20% 50%; animation:lago-cheer-r 0.575s ease-in-out infinite; }
    .l-eye { transform-box:fill-box; transform-origin:center; animation:lago-blink 6.5s ease-in-out infinite; }
    .l-spark { transform-box:fill-box; transform-origin:center; }
  </style>
  <defs><clipPath id="lago-body-f"><path d="M 100 34 C 82 8, 18 12, 14 62 C 6 104, 8 152, 34 190 C 56 220, 76 232, 100 234 C 124 232, 144 220, 166 190 C 192 152, 194 104, 186 62 C 182 12, 118 8, 100 34 Z"/></clipPath></defs>
  <g class="l-body">
    <path d="M 100 34 C 82 8, 18 12, 14 62 C 6 104, 8 152, 34 190 C 56 220, 76 232, 100 234 C 124 232, 144 220, 166 190 C 192 152, 194 104, 186 62 C 182 12, 118 8, 100 34 Z" fill="currentColor"/>
    <path d="M 100 34 C 104 14, 110 2, 116 -18" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
    <path d="M 108 6 C 126 -22, 160 -20, 148 -2 C 138 12, 116 14, 108 6 Z" fill="currentColor"/>
    <g clip-path="url(#lago-body-f)">
      <rect x="46" y="172" width="108" height="13" rx="6.5" fill="rgba(0,0,0,0.15)"/>
      <rect x="46" y="172" width="108" height="13" rx="6.5" fill="rgba(255,255,255,0.55)"/>
      <rect x="54" y="198" width="92" height="6" rx="3" fill="rgba(255,255,255,0.22)"/>
      <rect x="54" y="212" width="92" height="6" rx="3" fill="rgba(255,255,255,0.22)"/>
      <rect x="54" y="226" width="92" height="6" rx="3" fill="rgba(255,255,255,0.22)"/>
    </g>
    <ellipse class="l-arm-l" cx="-20" cy="106" rx="18" ry="12" fill="currentColor"/>
    <ellipse class="l-arm-r" cx="220" cy="106" rx="18" ry="12" fill="currentColor"/>
    <g fill="#F0D060">
      <path class="l-spark" style="animation:lago-star 2.3s ease-in-out infinite" d="M 0 -14 Q 2.2 -2.2 14 0 Q 2.2 2.2 0 14 Q -2.2 2.2 -14 0 Q -2.2 -2.2 0 -14 Z" transform="translate(-60 40)"/>
      <path class="l-spark" style="animation:lago-star 2.6s ease-in-out infinite 0.6s" d="M 0 -11 Q 1.8 -1.8 11 0 Q 1.8 1.8 0 11 Q -1.8 1.8 -11 0 Q -1.8 -1.8 0 -11 Z" transform="translate(260 52)"/>
      <path class="l-spark" style="animation:lago-star 2.1s ease-in-out infinite 1s" d="M 0 -9 Q 1.4 -1.4 9 0 Q 1.4 1.4 0 9 Q -1.4 1.4 -9 0 Q -1.4 -1.4 0 -9 Z" transform="translate(112 -68)"/>
      <circle class="l-spark" style="animation:lago-spark 2.1s ease-in-out infinite" cx="-66" cy="112" r="6.5"/>
      <circle class="l-spark" style="animation:lago-spark 2.1s ease-in-out infinite 0.5s" cx="266" cy="124" r="6.5"/>
      <circle class="l-spark" style="animation:lago-spark 1.7s ease-in-out infinite 0.9s" cx="-56" cy="178" r="4.5"/>
      <circle class="l-spark" style="animation:lago-spark 1.9s ease-in-out infinite 0.2s" cx="256" cy="190" r="4.5"/>
      <circle class="l-spark" style="animation:lago-spark 2s ease-in-out infinite 0.35s" cx="52" cy="-56" r="5"/>
    </g>
    <g class="l-eye">
      <ellipse cx="100" cy="106" rx="50" ry="52" fill="#FFFFFF"/>
      <g>
        <circle cx="100" cy="98" r="28" fill="#22201B"/>
        <circle cx="112" cy="86" r="9" fill="#FFFFFF"/>
        <circle cx="87" cy="112" r="4.5" fill="#FFFFFF" opacity="0.75"/>
      </g>
    </g>
    <path d="M 44 40 Q 88 16 138 42" fill="none" stroke="#22201B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
