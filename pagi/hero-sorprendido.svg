<svg xmlns="http://www.w3.org/2000/svg" viewBox="-260 -20 540 480" role="img" aria-label="Pagi sorprendido" overflow="visible">
  <style>
    @keyframes pg-float    { 0%,100%{transform:translateY(-8px) rotate(-.7deg)}50%{transform:translateY(8px) rotate(.7deg)} }
    @keyframes pg-arm-r    { 0%,100%{transform:translate(6px,-8px)}50%{transform:translate(-6px,8px)} }
    @keyframes pg-blink    { 0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)} }
    @keyframes stick-pulse { 0%,100%{opacity:.7}50%{opacity:1} }
    @keyframes pg-qbob     { 0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)} }
    .pg-body  { animation: pg-float 4.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 100px 248px; }
    .pg-arm-r { animation: pg-arm-r 3.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .pg-blink { animation: pg-blink 6.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .pg-stick { animation: stick-pulse 2.5s ease-in-out infinite; }
    .pg-q     { transform-box: fill-box; transform-origin: center; }
  </style>
  <g class="pg-body">
    <g fill="#E8B93F" font-family="system-ui,sans-serif" text-anchor="middle" font-weight="700">
      <text class="pg-q" x="-70" y="92" font-size="68" style="animation:pg-qbob 2.4s ease-in-out infinite">?</text>
      <text class="pg-q" x="240" y="70" font-size="56" style="animation:pg-qbob 2.8s ease-in-out infinite .6s">?</text>
      <text class="pg-q" x="100" y="-24" font-size="46" style="animation:pg-qbob 2.1s ease-in-out infinite 1s">?</text>
    </g>
    <ellipse cx="224" cy="238" rx="20" ry="14" fill="currentColor" class="pg-arm-r"/>
    <ellipse cx="-24" cy="180" rx="20" ry="14" fill="currentColor" transform="rotate(-22,-24,180)"/>
    <line x1="-24" y1="180" x2="-231" y2="312" stroke="currentColor" stroke-width="14" stroke-linecap="round" opacity="0.25"/>
    <line x1="-24" y1="180" x2="-231" y2="312" stroke="#F8F5F0" stroke-width="7" stroke-linecap="round" class="pg-stick"/>
    <circle cx="-231" cy="312" r="12" fill="currentColor" opacity="0.9"/>
    <path d="M 0 26 Q 0 0 26 0 L 174 0 Q 200 0 200 26 L 200 440 L 100 396 L 0 440 Z" fill="currentColor"/>
    <circle cx="100" cy="27" r="13" fill="#1D1822" opacity="0.28"/>
    <rect x="32" y="296" width="136" height="19" rx="9.5" fill="#000" opacity="0.15"/>
    <rect x="32" y="296" width="54" height="19" rx="9.5" fill="#fff" opacity="0.6"/>
    <rect x="44" y="340" width="112" height="7" rx="3.5" fill="#1D1822" opacity="0.18"/>
    <rect x="44" y="362" width="112" height="7" rx="3.5" fill="#1D1822" opacity="0.18"/>
    <rect x="44" y="384" width="112" height="7" rx="3.5" fill="#1D1822" opacity="0.18"/>
    <g class="pg-blink">
      <ellipse cx="88" cy="148" rx="58" ry="70" fill="#fff"/>
      <g class="pg-pupil">
        <circle cx="88" cy="148" r="31" fill="#1D1822"/>
        <circle cx="100" cy="135" r="10.5" fill="#fff"/>
        <circle cx="75" cy="162" r="5" fill="#fff" opacity="0.75"/>
      </g>
    </g>
    <path d="M 40 50 L 68 32 L 88 22 L 108 32 L 136 52" fill="none" stroke="#1D1822" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
