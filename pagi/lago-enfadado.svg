<svg xmlns="http://www.w3.org/2000/svg" viewBox="-90 -90 380 390" overflow="visible">
  <style>
    @keyframes lago-stomp { 0%,28%{transform:translateY(0) rotate(0deg)} 36%{transform:translateY(0) scaleY(0.92)} 44%{transform:translateY(-7%) rotate(-3.5deg)} 52%{transform:translateY(0) scaleY(0.94)} 60%{transform:translateY(-5.5%) rotate(3deg)} 70%{transform:translateY(0) scaleY(0.96)} 82%,100%{transform:translateY(0) rotate(0deg)} }
    @keyframes lago-squint { 0%,28%{transform:scaleY(1)} 40%,64%{transform:scaleY(0.62)} 80%,100%{transform:scaleY(1)} }
    @keyframes lago-shake-l { 0%,30%{transform:translate(-4%,30%) rotate(-6deg)} 40%{transform:translate(-12%,-44%) rotate(-42deg)} 50%{transform:translate(-4%,28%) rotate(-6deg)} 60%{transform:translate(-14%,-50%) rotate(-48deg)} 70%{transform:translate(-4%,26%) rotate(-6deg)} 82%,100%{transform:translate(-4%,30%) rotate(-6deg)} }
    @keyframes lago-shake-r { 0%,30%{transform:translate(4%,30%) rotate(6deg)} 40%{transform:translate(12%,-44%) rotate(42deg)} 50%{transform:translate(4%,28%) rotate(6deg)} 60%{transform:translate(14%,-50%) rotate(48deg)} 70%{transform:translate(4%,26%) rotate(6deg)} 82%,100%{transform:translate(4%,30%) rotate(6deg)} }
    @keyframes lago-arm-flush { 0%,100%{fill:currentColor} 40%,60%{fill:#9B1515} }
    @keyframes lago-steam { 0%{transform:translateY(0) scaleX(1);opacity:0} 20%{opacity:0.85} 80%{opacity:0.5} 100%{transform:translateY(-32px) scaleX(0.5);opacity:0} }
    @keyframes lago-blush { 0%,100%{opacity:0.18} 40%,60%{opacity:0.58} }
    @keyframes lago-flush-overlay { 0%,100%{opacity:0.06} 40%,60%{opacity:0.82} }
    .l-body { transform-box:fill-box; transform-origin:100px 120px; animation:lago-stomp 2.4s cubic-bezier(.3,.6,.4,1) infinite; }
    .l-arm-l { transform-box:fill-box; transform-origin:80% 50%; animation:lago-shake-l 2.4s ease-in-out infinite, lago-arm-flush 2.4s ease-in-out infinite; }
    .l-arm-r { transform-box:fill-box; transform-origin:20% 50%; animation:lago-shake-r 2.4s ease-in-out infinite, lago-arm-flush 2.4s ease-in-out infinite; }
    .l-eye { transform-box:fill-box; transform-origin:center; animation:lago-squint 2.4s ease-in-out infinite; }
    .l-steam { transform-box:fill-box; transform-origin:center; }
    .l-flush { animation:lago-flush-overlay 2.4s ease-in-out infinite; }
    .l-blush { animation:lago-blush 2.4s ease-in-out infinite; }
  </style>
  <defs>
    <clipPath id="apple-clip-e"><path d="M 100 34 C 82 8, 18 12, 14 62 C 6 104, 8 152, 34 190 C 56 220, 76 232, 100 234 C 124 232, 144 220, 166 190 C 192 152, 194 104, 186 62 C 182 12, 118 8, 100 34 Z"/></clipPath>
  </defs>
  <g class="l-body">
    <path d="M 100 34 C 82 8, 18 12, 14 62 C 6 104, 8 152, 34 190 C 56 220, 76 232, 100 234 C 124 232, 144 220, 166 190 C 192 152, 194 104, 186 62 C 182 12, 118 8, 100 34 Z" fill="currentColor"/>
    <path class="l-flush" d="M 100 34 C 82 8, 18 12, 14 62 C 6 104, 8 152, 34 190 C 56 220, 76 232, 100 234 C 124 232, 144 220, 166 190 C 192 152, 194 104, 186 62 C 182 12, 118 8, 100 34 Z" fill="#C01010"/>
    <path d="M 100 34 C 104 14, 110 2, 116 -18" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
    <path d="M 108 6 C 126 -22, 160 -20, 148 -2 C 138 12, 116 14, 108 6 Z" fill="currentColor"/>
    <g clip-path="url(#apple-clip-e)">
      <rect x="46" y="172" width="108" height="13" rx="6.5" fill="rgba(0,0,0,0.15)"/>
      <rect x="46" y="172" width="42" height="13" rx="6.5" fill="rgba(255,255,255,0.55)"/>
      <rect x="54" y="198" width="92" height="6" rx="3" fill="rgba(255,255,255,0.22)"/>
      <rect x="54" y="212" width="92" height="6" rx="3" fill="rgba(255,255,255,0.22)"/>
      <rect x="54" y="226" width="92" height="6" rx="3" fill="rgba(255,255,255,0.22)"/>
    </g>
    <ellipse class="l-arm-l" cx="-20" cy="118" rx="18" ry="12" fill="currentColor"/>
    <ellipse class="l-arm-r" cx="220" cy="118" rx="18" ry="12" fill="currentColor"/>
    <ellipse class="l-steam" style="animation:lago-steam 1.2s ease-out infinite" cx="56" cy="-18" rx="9" ry="6" fill="#C03030"/>
    <ellipse class="l-steam" style="animation:lago-steam 1.2s ease-out infinite 0.6s" cx="132" cy="-26" rx="7" ry="5" fill="#C03030"/>
    <g clip-path="url(#apple-clip-e)">
      <circle class="l-blush" cx="34" cy="144" r="16" fill="#D94040"/>
      <circle class="l-blush" cx="166" cy="144" r="16" fill="#D94040"/>
    </g>
    <g class="l-eye">
      <ellipse cx="100" cy="106" rx="50" ry="52" fill="#FFFFFF"/>
      <g>
        <circle cx="100" cy="116" r="28" fill="#22201B"/>
        <circle cx="112" cy="104" r="9" fill="#FFFFFF"/>
        <circle cx="87" cy="130" r="4.5" fill="#FFFFFF" opacity="0.75"/>
      </g>
    </g>
    <path d="M 40 34 L 68 52 L 88 40 L 108 52 L 140 34" fill="none" stroke="#22201B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
