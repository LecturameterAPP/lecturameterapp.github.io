<svg xmlns="http://www.w3.org/2000/svg" viewBox="-90 -90 380 390" overflow="visible">
  <style>
    @keyframes lago-float { 0%,100%{transform:translateY(-2%) rotate(-0.7deg)} 50%{transform:translateY(2%) rotate(0.7deg)} }
    @keyframes lago-blink { 0%,92%,100%{transform:scaleY(1)} 96%{transform:scaleY(0.08)} }
    @keyframes lago-arm-l { 0%,100%{transform:translate(-1.5%,2.4%)} 50%{transform:translate(1.5%,-2.4%)} }
    @keyframes lago-arm-r { 0%,100%{transform:translate(1.5%,-2.4%)} 50%{transform:translate(-1.5%,2.6%)} }
    .l-body { transform-box:fill-box; transform-origin:100px 120px; animation:lago-float 4.2s ease-in-out infinite; }
    .l-arm-l { transform-box:fill-box; transform-origin:80% 50%; animation:lago-arm-l 3.4s ease-in-out infinite; }
    .l-arm-r { transform-box:fill-box; transform-origin:20% 50%; animation:lago-arm-r 3.8s ease-in-out infinite; }
    .l-eye { transform-box:fill-box; transform-origin:center; animation:lago-blink 6.5s ease-in-out infinite; }
  </style>
  <defs><clipPath id="lago-body-n"><path d="M 100 34 C 82 8, 18 12, 14 62 C 6 104, 8 152, 34 190 C 56 220, 76 232, 100 234 C 124 232, 144 220, 166 190 C 192 152, 194 104, 186 62 C 182 12, 118 8, 100 34 Z"/></clipPath></defs>
  <g class="l-body">
    <path d="M 100 34 C 82 8, 18 12, 14 62 C 6 104, 8 152, 34 190 C 56 220, 76 232, 100 234 C 124 232, 144 220, 166 190 C 192 152, 194 104, 186 62 C 182 12, 118 8, 100 34 Z" fill="currentColor"/>
    <path d="M 100 34 C 104 14, 110 2, 116 -18" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
    <path d="M 108 6 C 126 -22, 160 -20, 148 -2 C 138 12, 116 14, 108 6 Z" fill="currentColor"/>
    <g clip-path="url(#lago-body-n)">
      <rect x="46" y="172" width="108" height="13" rx="6.5" fill="rgba(0,0,0,0.15)"/>
      <rect x="46" y="172" width="14" height="13" rx="6.5" fill="rgba(255,255,255,0.55)"/>
      <rect x="54" y="198" width="92" height="6" rx="3" fill="rgba(255,255,255,0.22)"/>
      <rect x="54" y="212" width="92" height="6" rx="3" fill="rgba(255,255,255,0.22)"/>
      <rect x="54" y="226" width="92" height="6" rx="3" fill="rgba(255,255,255,0.22)"/>
    </g>
    <ellipse class="l-arm-l" cx="-20" cy="130" rx="18" ry="12" fill="currentColor"/>
    <ellipse class="l-arm-r" cx="220" cy="130" rx="18" ry="12" fill="currentColor"/>
    <g class="l-eye">
      <ellipse cx="100" cy="106" rx="50" ry="52" fill="#FFFFFF"/>
      <g class="pg-pupil-lago">
        <circle cx="100" cy="106" r="28" fill="#22201B"/>
        <circle cx="112" cy="94" r="9" fill="#FFFFFF"/>
        <circle cx="87" cy="120" r="4.5" fill="#FFFFFF" opacity="0.75"/>
      </g>
    </g>
    <path d="M 44 46 Q 88 22 138 48" fill="none" stroke="#22201B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
