<svg xmlns="http://www.w3.org/2000/svg" viewBox="-100 -80 400 580" overflow="visible">
  <style>
    @keyframes pagi-hop{0%{transform:translateY(0) rotate(0deg)}18%{transform:translateY(0) scaleY(0.94) rotate(0deg)}42%{transform:translateY(-7%) rotate(-2deg)}62%{transform:translateY(-4%) rotate(2deg)}82%{transform:translateY(0) scaleY(0.97) rotate(0deg)}100%{transform:translateY(0) rotate(0deg)}}
    @keyframes pagi-cheer-l{0%,100%{transform:translate(-4%,6%) rotate(-8deg)}50%{transform:translate(2%,-26%) rotate(16deg)}}
    @keyframes pagi-cheer-r{0%,100%{transform:translate(4%,6%) rotate(8deg)}50%{transform:translate(-2%,-26%) rotate(-16deg)}}
    @keyframes pagi-blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(0.08)}}
    @keyframes pagi-glance{0%,26%{transform:translate(0,0)}33%,44%{transform:translate(-9px,3px)}52%,63%{transform:translate(10px,-2px)}71%,100%{transform:translate(0,0)}}
    @keyframes pagi-spark{0%,100%{transform:scale(0.5);opacity:0.35}50%{transform:scale(1);opacity:1}}
    @keyframes pagi-star{0%,100%{transform:scale(0.45) rotate(-18deg);opacity:0.4}50%{transform:scale(1) rotate(12deg);opacity:1}}
    .body-g{transform-origin:100px 248px;animation:pagi-hop 1.15s cubic-bezier(.3,.7,.4,1) infinite}
    .eye-g{transform-box:fill-box;transform-origin:center;animation:pagi-blink 6.5s ease-in-out infinite}
    .pupil-g{animation:pagi-glance 7.5s ease-in-out infinite}
    .arm-l{transform-box:fill-box;transform-origin:80% 50%;animation:pagi-cheer-l 0.575s ease-in-out infinite}
    .arm-r{transform-box:fill-box;transform-origin:20% 50%;animation:pagi-cheer-r 0.575s ease-in-out infinite}
    .sp1{transform-box:fill-box;transform-origin:center;animation:pagi-spark 2.1s ease-in-out infinite}
    .sp2{transform-box:fill-box;transform-origin:center;animation:pagi-spark 2.1s ease-in-out infinite 0.5s}
    .sp3{transform-box:fill-box;transform-origin:center;animation:pagi-spark 1.7s ease-in-out infinite 0.9s}
    .sp4{transform-box:fill-box;transform-origin:center;animation:pagi-spark 1.9s ease-in-out infinite 0.2s}
    .sp5{transform-box:fill-box;transform-origin:center;animation:pagi-spark 2.4s ease-in-out infinite 1.1s}
    .sp6{transform-box:fill-box;transform-origin:center;animation:pagi-spark 2.2s ease-in-out infinite 0.7s}
    .sp7{transform-box:fill-box;transform-origin:center;animation:pagi-spark 2s ease-in-out infinite 0.35s}
    .sp8{transform-box:fill-box;transform-origin:center;animation:pagi-spark 1.8s ease-in-out infinite 1.3s}
    .st1{transform-box:fill-box;transform-origin:center;animation:pagi-star 2.3s ease-in-out infinite}
    .st2{transform-box:fill-box;transform-origin:center;animation:pagi-star 2.6s ease-in-out infinite 0.6s}
    .st3{transform-box:fill-box;transform-origin:center;animation:pagi-star 2.1s ease-in-out infinite 1s}
    .st4{transform-box:fill-box;transform-origin:center;animation:pagi-star 2.8s ease-in-out infinite 0.3s}
  </style>
  <g class="body-g">
    <path d="M 0 26 Q 0 0 26 0 L 174 0 Q 200 0 200 26 L 200 440 L 100 396 L 0 440 Z" fill="currentColor"/>
    <circle cx="100" cy="27" r="13" fill="#1D1822" opacity="0.28"/>
    <rect x="32" y="296" width="136" height="19" rx="9.5" fill="#000000" opacity="0.15"/>
    <rect x="32" y="296" width="136" height="19" rx="9.5" fill="#FFFFFF" opacity="0.6"/>
    <rect x="44" y="340" width="112" height="7" rx="3.5" fill="#1D1822" opacity="0.18"/>
    <rect x="44" y="362" width="112" height="7" rx="3.5" fill="#1D1822" opacity="0.18"/>
    <rect x="44" y="384" width="112" height="7" rx="3.5" fill="#1D1822" opacity="0.18"/>
    <ellipse class="arm-l" cx="-24" cy="198" rx="20" ry="14" fill="currentColor"/>
    <ellipse class="arm-r" cx="224" cy="198" rx="20" ry="14" fill="currentColor"/>
    <g class="eye-g">
      <ellipse cx="88" cy="152" rx="56" ry="62" fill="#FFFFFF"/>
      <g class="pupil-g">
        <circle cx="89" cy="145" r="31" fill="#1D1822"/>
        <circle cx="101" cy="132" r="10.5" fill="#FFFFFF"/>
        <circle cx="76" cy="160" r="5" fill="#FFFFFF" opacity="0.75"/>
      </g>
    </g>
    <path d="M 42 68 Q 88 44 134 70" fill="none" stroke="#1D1822" stroke-width="9" stroke-linecap="round"/>
    <g fill="#E8B93F">
      <path class="st1" d="M 0 -15 Q 2.4 -2.4 15 0 Q 2.4 2.4 0 15 Q -2.4 2.4 -15 0 Q -2.4 -2.4 0 -15 Z" transform="translate(-62 40)"/>
      <path class="st2" d="M 0 -12 Q 1.9 -1.9 12 0 Q 1.9 1.9 0 12 Q -1.9 1.9 -12 0 Q -1.9 -1.9 0 -12 Z" transform="translate(262 52)"/>
      <path class="st3" d="M 0 -10 Q 1.6 -1.6 10 0 Q 1.6 1.6 0 10 Q -1.6 1.6 -10 0 Q -1.6 -1.6 0 -10 Z" transform="translate(112 -74)"/>
      <path class="st4" d="M 0 -9 Q 1.4 -1.4 9 0 Q 1.4 1.4 0 9 Q -1.4 1.4 -9 0 Q -1.4 -1.4 0 -9 Z" transform="translate(-52 318)"/>
      <circle class="sp1" cx="-68" cy="122" r="7"/>
      <circle class="sp2" cx="268" cy="134" r="7"/>
      <circle class="sp3" cx="-58" cy="192" r="5"/>
      <circle class="sp4" cx="258" cy="204" r="5"/>
      <circle class="sp5" cx="-74" cy="258" r="3.5"/>
      <circle class="sp6" cx="274" cy="270" r="3.5"/>
      <circle class="sp7" cx="54" cy="-44" r="5.5"/>
      <circle class="sp8" cx="164" cy="-54" r="4"/>
    </g>
  </g>
</svg>
